global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: node
  static_configs:
  - targets:
    - node-exporter:9100
    labels:
      host: docker-host
- job_name: snmp
  metrics_path: /snmp
  params:
    module:
    - if_mib
    auth:
    - public_v2
  static_configs:
  - targets:
    - snmpsim
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: snmp-exporter:9116
