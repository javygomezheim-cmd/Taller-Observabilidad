# Unifica los talleres vistos en clases: Prometheus + Node Exporter + SNMP + Loki + Promtail
# + Grafana + Jaeger + OpenTelemetry Collector + HotROD.
services:
  # ---------- Taller 1: Prometheus y Node Exporter ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      snmp-net:
        ipv4_address: 172.21.0.10
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - snmp-net
    restart: unless-stopped

  # ---------- Taller 2: SNMP ----------
  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    ports:
      - "9116:9116"
    networks:
      snmp-net:
        ipv4_address: 172.21.0.11
    restart: unless-stopped

  router_sim:
    # Contenedor que simula un agente SNMP (Router/Switch)
    image: towsos_net-snmp
    container_name: router_sim
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "161:161/udp"
    networks:
      snmp-net:
        ipv4_address: 172.21.0.12
    volumes:
      - ./snmpd.conf:/usr/local/etc/snmp/snmpd.conf
    restart: unless-stopped

  # ---------- Taller 3: Loki, Promtail y Grafana ----------
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - snmp-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      # Logs locales del host
      - /var/log:/var/log:ro
      # Archivo de configuracion custom
      - ./promtail-config.yml:/etc/promtail/config.yml
      # Carpeta local que simula logs de cloud
      - ./cloud-logs:/var/cloud-logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - snmp-net
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - snmp-net
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  # ---------- Taller 4: Trazas (Jaeger, OTel Collector, HotROD) ----------
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    ports:
      - "16686:16686"   # UI de Jaeger
      - "4317:4317"     # OTLP gRPC de Jaeger
    environment:
      - collector_otlp_enabled=true
    networks:
      - snmp-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"     # receptor OTLP HTTP
    networks:
      - snmp-net
    depends_on:
      - jaeger
    restart: unless-stopped

  hotrod:
    image: jaegertracing/example-hotrod:latest
    container_name: hotrod_app
    ports:
      - "8080:8080"     # UI de la aplicacion de prueba
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    command: ["all", "--otel-exporter=otlp"]
    networks:
      - snmp-net
    depends_on:
      - otel-collector
    restart: unless-stopped

networks:
  snmp-net:
    ipam:
      config:
        - subnet: 172.21.0.0/24
